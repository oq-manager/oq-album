<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>앨범 교환소</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
body{
background:#eef2f6;
font-family:'Apple SD Gothic Neo',sans-serif;
}
[v-cloak]{display:none}
</style>
</head>

<body>

<div id="app" v-cloak class="max-w-xl mx-auto p-4">

<h1 class="text-xl font-bold mb-4">앨범 교환소</h1>

<div class="space-y-2">

<button @click="openDeal('win')" class="w-full bg-green-500 text-white p-3 rounded-lg">
🤝 윈윈 교환
</button>

<button @click="openDeal('share')" class="w-full bg-blue-500 text-white p-3 rounded-lg">
🎁 나눔 교환
</button>

</div>


<!-- 거래 모달 -->
<div v-if="dealOpen" class="fixed inset-0 bg-black/40 flex items-center justify-center">

<div class="bg-white p-5 rounded-xl w-96">

<h2 class="font-bold mb-4">

<span v-if="dealType==='win'">🤝 윈윈 교환</span>
<span v-if="dealType==='share'">🎁 나눔 교환</span>

</h2>

<div class="space-y-3">

<div>
<label class="text-sm">내가 줄 카드</label>

<select v-model.number="giveCard" class="w-full border p-2 rounded">

<option :value="null">선택</option>

<option
v-for="c in giveList"
:key="c.index"
:value="c.index"
>
{{c.name}}
</option>

</select>
</div>


<div>
<label class="text-sm">내가 받을 카드</label>

<select v-model.number="receiveCard" class="w-full border p-2 rounded">

<option :value="null">선택</option>

<option
v-for="c in receiveList"
:key="c.index"
:value="c.index"
>
{{c.name}}
</option>

</select>
</div>


</div>


<div class="flex gap-2 mt-4">

<button
@click="confirmDeal"
class="flex-1 bg-black text-white p-2 rounded"
>
거래 기록
</button>

<button
@click="dealOpen=false"
class="flex-1 bg-gray-200 p-2 rounded"
>
취소
</button>

</div>

</div>
</div>


</div>


<script>

const {createApp,ref,computed}=Vue

createApp({

setup(){

const dealOpen=ref(false)
const dealType=ref("win")

const giveCard=ref(null)
const receiveCard=ref(null)


const myCollection=ref(Array(81).fill(0))
const targetCollection=ref(Array(81).fill(0))


const cardName=i=>`S${Math.floor(i/9)+1}-${i%9+1}`


const giveList=computed(()=>{

let arr=[]

for(let i=0;i<81;i++){

const my=myCollection.value[i]
const tg=targetCollection.value[i]

if(dealType.value==="win"){

if(my>1 && tg===0){
arr.push({index:i,name:cardName(i)})
}

}else{

if(my>1){
arr.push({index:i,name:cardName(i)})
}

}

}

return arr

})


const receiveList=computed(()=>{

let arr=[]

for(let i=0;i<81;i++){

const my=myCollection.value[i]
const tg=targetCollection.value[i]

if(dealType.value==="win"){

if(tg>1 && my===0){
arr.push({index:i,name:cardName(i)})
}

}else{

if(tg>1){
arr.push({index:i,name:cardName(i)})
}

}

}

return arr

})


function openDeal(type){

dealType.value=type

giveCard.value=null
receiveCard.value=null

dealOpen.value=true

}



function confirmDeal(){

if(giveCard.value===null || receiveCard.value===null){

alert("카드를 선택해주세요")
return

}

const g=giveCard.value
const r=receiveCard.value

myCollection.value[g]--
targetCollection.value[g]++

myCollection.value[r]++
targetCollection.value[r]--

alert("거래 기록 완료")

dealOpen.value=false

}



return{

dealOpen,
dealType,

giveCard,
receiveCard,

giveList,
receiveList,

openDeal,
confirmDeal

}

}

}).mount("#app")

</script>

</body>
</html>
